<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placita Partner CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: light dark;
    --bg:#F5F2EC; --surface:#FBF9F4; --surface-2:#EEE8DA; --line:#DED5C2;
    --ink:#221F38; --ink-muted:#5E5A78; --ink-faint:#918DA6;
    --accent:#236EB2; --accent-ink:#FFFFFF; --accent-soft:#DCEAF8;
    --good:#3F8F5C; --good-soft:#DCEEE1; --warn:#C98A2E; --warn-soft:#F5E6C8;
    --critical:#B0392E; --critical-soft:#F5DCD8; --neutral:#726C85; --neutral-soft:#E7E4EE;
    --cat-1:#C1622A; --cat-2:#2A6FB0; --cat-3:#2F7A4F; --cat-4:#A9760F; --cat-5:#8B3E7A; --cat-6:#0A9494; --cat-7:#6F60B2; --cat-8:#B0434F;
    --stage-1:#7FACDC; --stage-2:#5F97CC; --stage-3:#3B82C8; --stage-4:#236EB2; --stage-5:#726C85;
    --font-display:'Libre Franklin',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --radius:12px;
    --shadow-sm:0 1px 2px rgba(36,33,28,0.06), 0 1px 1px rgba(36,33,28,0.04);
    --shadow-md:0 8px 24px rgba(36,33,28,0.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171511; --surface:#211E18; --surface-2:#2A2620; --line:#39332A;
      --ink:#ECE9F5; --ink-muted:#B6B2C9; --ink-faint:#8985A0;
      --accent:#6FA8E0; --accent-ink:#13202E; --accent-soft:#1E3448;
      --good:#5FAE7C; --good-soft:#24352A; --warn:#E0A94E; --warn-soft:#3A2E17;
      --critical:#D66558; --critical-soft:#3A2019; --neutral:#9690A8; --neutral-soft:#2A2733;
      --stage-1:#294258; --stage-2:#355E82; --stage-3:#4C85B8; --stage-4:#6FA8E0; --stage-5:#9690A8;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.3); --shadow-md:0 12px 30px rgba(0,0,0,0.45);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body);
    font-size:14px; line-height:1.5; margin:0;
  }
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:800; margin:0; text-wrap:balance; color:var(--ink);}
  a{color:var(--accent);}
  button{font-family:var(--font-body); cursor:pointer;}
  input,select,textarea{font-family:var(--font-body); font-size:14px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:9px 11px; transition:border-color .12s;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .tabular{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  svg{display:block;}
  .icon{width:16px; height:16px; stroke:currentColor; stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}

  #boot{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:100;}
  .spinner{width:28px; height:28px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #auth-screen{min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px;}
  .auth-card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-md); padding:32px 30px;}
  .auth-brand{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .auth-brand .mark{width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:900; font-size:16px;}
  .auth-brand .org{font-family:var(--font-display); font-weight:800; font-size:16px;}
  .auth-brand .sub{font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.07em;}
  .auth-tabs{display:flex; gap:4px; background:var(--surface-2); border-radius:9px; padding:3px; margin-bottom:20px;}
  .auth-tab{flex:1; text-align:center; padding:8px; border-radius:7px; border:none; background:none; color:var(--ink-muted); font-weight:700; font-size:13px;}
  .auth-tab.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm);}
  .auth-field{margin-bottom:13px;}
  .auth-field label{display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:5px;}
  .auth-field input{width:100%;}
  .auth-error{background:var(--critical-soft); color:var(--critical); font-size:12.5px; padding:9px 11px; border-radius:8px; margin-bottom:13px; display:none;}
  .auth-error.show{display:block;}
  .auth-submit{width:100%; margin-top:6px;}
  .auth-note{font-size:12px; color:var(--ink-faint); margin-top:16px; line-height:1.6; text-align:center;}
  .config-warning{max-width:480px; margin:60px auto; background:var(--warn-soft); color:var(--warn); border-radius:12px; padding:20px 22px; font-size:13.5px; line-height:1.6;}
  .config-warning code{background:rgba(0,0,0,0.08); padding:1px 5px; border-radius:4px; font-family:var(--font-mono); font-size:12px;}

  .app-shell{display:none; grid-template-columns:236px 1fr; min-height:100vh;}
  .app-shell.on{display:grid;}
  @media (max-width:840px){ .app-shell{grid-template-columns:1fr;} .sidebar{position:sticky; top:0; z-index:20;} }
  .sidebar{background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:20px 14px;}
  .brand{display:flex; align-items:center; gap:10px; padding:2px 8px 20px; border-bottom:1px solid var(--line); margin-bottom:14px;}
  .brand .mark{width:30px; height:30px; border-radius:8px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:900; font-size:14px; flex-shrink:0;}
  .brand .names{display:flex; flex-direction:column; gap:1px;}
  .brand .org{font-family:var(--font-display); font-weight:800; font-size:15px; letter-spacing:-0.01em;}
  .brand .sub{font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-muted);}
  .nav{display:flex; flex-direction:column; gap:2px; flex:1;}
  .nav-btn{display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:9px; border:none; background:transparent; color:var(--ink-muted); font-size:13.5px; font-weight:600; text-align:left; width:100%; transition:background .1s;}
  .nav-btn:hover{background:var(--surface-2); color:var(--ink);}
  .nav-btn.active{background:var(--accent-soft); color:var(--accent);}
  .sync-dot{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-faint); padding:0 8px;}
  .sync-dot .d{width:6px; height:6px; border-radius:50%; background:var(--good);}

  .main{padding:20px 32px 60px; max-width:1180px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .topbar h1{font-size:23px;}
  .topbar .meta{color:var(--ink-muted); font-size:13px; margin-top:2px;}
  .user-menu{position:relative;}
  .user-btn{display:flex; align-items:center; gap:9px; padding:6px 12px 6px 6px; border-radius:99px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow-sm);}
  .avatar{width:28px; height:28px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0;}
  .user-btn .name{font-size:13px; font-weight:700;}
  .user-btn .role{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.05em;}
  .user-dropdown{position:absolute; right:0; top:calc(100% + 8px); background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow-md); min-width:180px; overflow:hidden; z-index:30; display:none;}
  .user-dropdown.open{display:block;}
  .user-dropdown button{width:100%; text-align:left; padding:10px 14px; background:none; border:none; font-size:13px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:8px;}
  .user-dropdown button:hover{background:var(--surface-2);}

  .view{display:none;} .view.active{display:block;}
  .banner{display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:9px; font-size:13px; margin-bottom:18px;}
  .banner.warn{background:var(--warn-soft); color:var(--warn);}
  .banner.info{background:var(--surface-2); color:var(--ink-muted);}
  .banner.critical{background:var(--critical-soft); color:var(--critical);}

  .btn{border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:13px; font-weight:600; padding:8px 14px; display:inline-flex; align-items:center; gap:6px; box-shadow:var(--shadow-sm); transition:transform .06s, filter .1s;}
  .btn:hover{filter:brightness(0.97);}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-danger{background:var(--critical-soft); color:var(--critical); border-color:transparent; box-shadow:none;}
  .btn-sm{padding:5px 10px; font-size:12px;}
  .btn-ghost{background:none; border:none; color:var(--ink-muted); box-shadow:none;}
  .btn-block{width:100%; justify-content:center;}

  .grid{display:grid; gap:14px;}
  .kpi-row{grid-template-columns:repeat(4,1fr); margin-bottom:18px;}
  @media (max-width:760px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow-sm);}
  .kpi .top{display:flex; align-items:center; justify-content:space-between;}
  .kpi .label{font-size:11px; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-faint); font-weight:700;}
  .kpi .icon-badge{width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent);}
  .kpi .value{font-family:var(--font-display); font-size:28px; font-weight:800; margin-top:8px;}
  .kpi .sub{font-size:12px; color:var(--ink-muted); margin-top:2px;}
  .panels{grid-template-columns:1fr 1fr; align-items:start;}
  @media (max-width:900px){.panels{grid-template-columns:1fr;}}
  .card h3{font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:7px;}
  .card h3 .n{color:var(--ink-faint); font-weight:600;}

  .barlist{display:flex; flex-direction:column; gap:9px;}
  .barlist-row{display:grid; grid-template-columns:150px 1fr 34px; align-items:center; gap:8px; font-size:12.5px;}
  .barlist-name{display:flex; align-items:center; gap:6px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .swatch{width:9px; height:9px; border-radius:2px; flex-shrink:0;}
  .barlist-track{background:var(--surface-2); border-radius:5px; height:10px; overflow:hidden;}
  .barlist-fill{height:100%; border-radius:5px; transition:width .3s;}
  .barlist-val{text-align:right; color:var(--ink-muted); font-weight:600;}
  .empty-note{color:var(--ink-faint); font-size:13px; padding:8px 2px;}

  .funnel{display:flex; flex-direction:column; gap:8px;}
  .funnel-row{display:grid; grid-template-columns:130px 1fr 30px; align-items:center; gap:10px; font-size:12.5px;}
  .funnel-track{background:var(--surface-2); border-radius:7px; height:22px; overflow:hidden;}
  .funnel-fill{height:100%; border-radius:7px; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; transition:width .3s;}

  .followup-list{display:flex; flex-direction:column;}
  .followup-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .followup-row:last-child{border-bottom:none;}
  .followup-org{font-weight:600; font-size:13px;}
  .followup-when{font-size:12px; color:var(--ink-muted);}
  .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700;}
  .pill.critical{background:var(--critical-soft); color:var(--critical);}
  .pill.warn{background:var(--warn-soft); color:var(--warn);}
  .pill.good{background:var(--good-soft); color:var(--good);}
  .pill.neutral{background:var(--neutral-soft); color:var(--neutral);}

  .spark-wrap{margin-top:4px;}
  .spark-line{fill:none; stroke:var(--accent); stroke-width:2;}
  .spark-area{fill:var(--accent); opacity:0.12;}
  .spark-dot{fill:var(--accent);}
  .spark-grid{stroke:var(--line); stroke-width:1;}
  .spark-label{fill:var(--ink-faint); font-size:9px; font-family:var(--font-mono);}

  .table-toolbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
  .search-wrap{position:relative; flex:1; min-width:180px;}
  .search-wrap .icon{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint);}
  .search-input{width:100%; padding-left:34px;}
  .chip-filter{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{border:1px solid var(--line); background:var(--surface); color:var(--ink-muted); border-radius:99px; padding:5px 12px; font-size:12px; font-weight:600;}
  .chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .table-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow-sm);}
  table{border-collapse:collapse; width:100%; min-width:760px;}
  thead th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); background:var(--surface-2); padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer;}
  thead th:hover{color:var(--ink);}
  tbody td{padding:11px 14px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:var(--surface-2);}
  .org-cell{font-weight:700;}
  .type-tag{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-muted);}
  .stage-pill{display:inline-block; padding:3px 10px; border-radius:99px; font-size:11.5px; font-weight:700; color:#fff;}

  .scrim{position:fixed; inset:0; background:rgba(20,18,14,0.42); z-index:40; display:none;}
  .scrim.open{display:block;}
  .slideover{position:fixed; top:0; right:0; bottom:0; width:min(460px,100vw); background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow-md); z-index:41; transform:translateX(100%); transition:transform .18s ease; display:flex; flex-direction:column;}
  .slideover.open{transform:translateX(0);}
  .so-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:18px 20px; border-bottom:1px solid var(--line);}
  .so-body{padding:18px 20px; overflow-y:auto; flex:1;}
  .so-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:10px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .chips-select{display:flex; flex-wrap:wrap; gap:6px;}
  .contact-row{border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:var(--surface-2);}
  .contact-row-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .contact-row-head .n{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint);}
  .contact-row .field{margin-bottom:8px;}
  .contact-row .field-row{margin-bottom:0;}
  .remove-contact-btn{background:none; border:none; color:var(--ink-faint); font-size:12px; font-weight:600; padding:2px 4px;}
  .remove-contact-btn:hover{color:var(--critical);}
  .add-contact-btn{width:100%; justify-content:center; border-style:dashed;}
  .chip-toggle{border:1px solid var(--line); background:var(--surface); color:var(--ink-muted); border-radius:99px; padding:5px 11px; font-size:12px; font-weight:600;}
  .chip-toggle.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  .activity-item{display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line);}
  .activity-item:first-child{border-top:none;}
  .activity-dot{width:7px; height:7px; border-radius:50%; background:var(--accent); margin-top:6px; flex-shrink:0;}
  .activity-meta{font-size:11px; color:var(--ink-faint); margin-top:2px;}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(12px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:9px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .15s, transform .15s; z-index:60; box-shadow:var(--shadow-md);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .section-gap{margin-top:26px;}
  .divider{height:1px; background:var(--line); margin:20px 0;}
  .muted{color:var(--ink-muted);}
  .strategy-block h4{font-size:13px; margin-bottom:6px;}
  .strategy-block textarea{width:100%; min-height:110px; resize:vertical; line-height:1.55;}
  .info-box{background:var(--surface-2); border-radius:9px; padding:12px 14px; font-size:12.5px; color:var(--ink-muted); line-height:1.6;}
  .team-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); gap:10px;}
  .team-row:last-child{border-bottom:none;}
  .team-row-left{display:flex; align-items:center; gap:10px; min-width:0;}
  .role-badge{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; padding:2px 8px; border-radius:99px; background:var(--accent-soft); color:var(--accent);}
  .role-badge.member{background:var(--surface-2); color:var(--ink-muted);}
  .modal-backdrop{position:fixed; inset:0; background:rgba(20,18,14,0.5); z-index:70; display:flex; align-items:center; justify-content:center;}
  .modal-card{background:var(--surface); border-radius:var(--radius); border:1px solid var(--line); box-shadow:var(--shadow-md); padding:22px; width:min(340px,90vw);}
  .modal-card h3{margin-bottom:12px;}
  .skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 37%,var(--surface-2) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:6px;}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
</style>
</head>
<body>

<div id="boot"><div class="spinner"></div></div>
<div id="config-root"></div>
<div id="auth-root"></div>
<div class="app-shell" id="app-shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>
<div class="scrim" id="scrim"></div>
<div class="slideover" id="slideover"></div>
<div id="overlay-root"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>

(function(){

  async function submitAuth(){

        if(!name){ showAuthError('Enter your name.'); btn.disabled=false; btn.textContent='Create account'; return; }
        var res = await sbClient.auth.signUp({ email:email, password:pw, options:{ data:{ name:name } } });
        if(res.error) throw res.error;
        if(res.data && res.data.user && !res.data.session){
          showAuthError('');
          toast('Check your email to confirm your account, then sign in.');
          authMode='signin'; renderAuth();

  var pendingImportRows = null;

  function parseCsvRows(text){
    var rows = [], row = [], field = '', inQuotes = false;
    text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    for(var i=0;i<text.length;i++){
      var ch = text[i];
      if(inQuotes){
        if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
        else field+=ch;
      }else{
        if(ch==='"') inQuotes=true;
        else if(ch===','){ row.push(field); field=''; }
        else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
        else field+=ch;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.length>1 || (r[0] && r[0].trim()); });
  }

  function parseImportCsv(text){
    var rows = parseCsvRows(text);
    if(!rows.length) throw new Error('File is empty');
    var header = rows[0].map(function(h){ return (h||'').trim().toLowerCase(); });
    function col(name){ return header.indexOf(name); }
    var iOrg=col('organization name'), iType=col('type'), iSvc=col('service lines'), iAddr=col('address'), iCity=col('city'),
        iPrio=col('priority'), iNext=col('next follow-up'),
        iCName=col('contact name'), iCTitle=col('contact title'), iCPhone=col('contact phone'), iCEmail=col('contact email');
    if(iOrg<0) throw new Error('No "Organization Name" column found — check it matches the template');

    var typeByLabel = {};
    PARTNER_TYPES.forEach(function(t){ typeByLabel[t.label.toLowerCase()] = t.key; });

    var groups = {}, order = [], skipped = 0, contactCount = 0;
    for(var r=1;r<rows.length;r++){
      var row = rows[r];
      var org = (row[iOrg]||'').trim();
      if(!org){ skipped++; continue; }
      if(!groups[org]){
        groups[org] = {
          org_name: org,
          type: (iType>=0 && typeByLabel[(row[iType]||'').trim().toLowerCase()]) || 'other',
          service_lines: iSvc>=0 ? (row[iSvc]||'').split(/[;,]/).map(function(s){return s.trim();}).filter(function(s){ return SERVICE_LINES.indexOf(s)>-1; }) : [],
          address: iAddr>=0 ? (row[iAddr]||'').trim() : '',
          city: iCity>=0 ? (row[iCity]||'').trim() : '',
          priority: iPrio>=0 ? (row[iPrio]||'').trim() : '',
          next_follow_up: iNext>=0 ? ((row[iNext]||'').trim() || null) : null,
          stage: 'Prospect',
          contacts: []
        };
        order.push(org);
      }
      if(iCName>=0 || iCPhone>=0 || iCEmail>=0 || iCTitle>=0){
        var c = { name:(row[iCName]||'').trim(), title:(row[iCTitle]||'').trim(), phone:(row[iCPhone]||'').trim(), email:(row[iCEmail]||'').trim() };
        if(c.name||c.title||c.phone||c.email){ groups[org].contacts.push(c); contactCount++; }
      }
    }
    return { partners: order.map(function(o){ return groups[o]; }), skipped: skipped, contactCount: contactCount };
  }

  function csvEsc(v){ v = v===undefined||v===null?'':String(v); if(/[",\n]/.test(v)){ v = '"'+v.replace(/"/g,'""')+'"'; } return v; }

  function downloadImportTemplate(){
    var cols = ['Organization Name','Type','Service Lines','Address','City','Priority','Next Follow-up','Contact Name','Contact Title','Contact Phone','Contact Email'];
    var example1 = ['Sonora Valley Hospital','Hospital','Hospice; Home Health','123 Main St','Tucson','','','Jane Smith','Discharge Planner','520-555-0100','jane@example.com'];
    var example2 = ['Sonora Valley Hospital','Hospital','Hospice; Home Health','123 Main St','Tucson','','','Mark Lee','Case Manager','520-555-0101','mark@example.com'];
    var text = [cols, example1, example2].map(function(r){ return r.map(csvEsc).join(','); }).join('\n');
    var blob = new Blob([text], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=url; a.download='partner-import-template.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

        '<a href="#" id="import-template-link">Download a template</a> to see the exact columns expected.</p>'+
        '<input type="file" id="import-file-input" accept=".csv" style="width:100%;margin-bottom:10px;"/>'+
        '<div id="import-summary" class="muted" style="font-size:12.5px;min-height:18px;"></div>',
      actions: [
        {label:'Import', primary:true, onClick: function(){ runImport(); }},

      ]
    });
    document.getElementById('import-template-link').addEventListener('click', function(e){ e.preventDefault(); downloadImportTemplate(); });
    document.getElementById('import-file-input').addEventListener('change', function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){

        try{
          var parsed = parseImportCsv(ev.target.result);
          if(!parsed.partners.length){ throw new Error('No rows with an organization name were found'); }
          pendingImportRows = parsed.partners;
          summaryEl.innerHTML = '<strong style="color:var(--ink);">'+parsed.partners.length+' organization'+(parsed.partners.length===1?'':'s')+'</strong> ready to import'+
            (parsed.contactCount ? ', with '+parsed.contactCount+' contact'+(parsed.contactCount===1?'':'s') : '')+
            (parsed.skipped ? '. '+parsed.skipped+' row'+(parsed.skipped===1?'':'s')+' skipped (no organization name).' : '.');
        }catch(err){
          pendingImportRows = null;
          summaryEl.innerHTML = '<span style="color:var(--critical);">Couldn’t read that file: '+esc(err.message)+'</span>';
        }
      };
      reader.readAsText(file);
    });
  }

  async function runImport(){
    if(!pendingImportRows || !pendingImportRows.length){ toast('Choose a CSV file first', true); return; }
    var rowsToInsert = pendingImportRows.map(function(p){
      return {
        org_name: p.org_name, type: p.type, service_lines: p.service_lines,
        address: p.address, city: p.city, contacts: p.contacts,
        stage: p.stage, priority: p.priority, next_follow_up: p.next_follow_up,
        activity: logActivityLocal([], 'created', 'Imported from CSV'),
        added_by: session.user.id, added_by_name: profile.name,
        updated_by: session.user.id, updated_by_name: profile.name
      };
    });
    var count = rowsToInsert.length;
    closeModal();
    var res = await sbClient.from('partners').insert(rowsToInsert).select();
    if(res.error){ toast('Import failed: '+res.error.message, true); return; }
    DATA.partners = res.data.concat(DATA.partners);
    pendingImportRows = null;
    toast('Imported '+res.data.length+' of '+count+' partners');
    render();
  }

  function computeKpis(){
    var total = DATA.partners.length;
    var active = DATA.partners.filter(function(p){ return p.stage==='Active Partner'; }).length;
    var prospects = DATA.partners.filter(function(p){ return p.stage==='Prospect'; }).length;
    var overdue=0, dueSoon=0;
    DATA.partners.forEach(function(p){
      var d = daysUntil(p.next_follow_up);
      if(d===null) return;
      if(d<0) overdue++; else if(d<=7) dueSoon++;
    });
    return {total:total, active:active, prospects:prospects, overdue:overdue, dueSoon:dueSoon};
  }

    var funnelHtml = FUNNEL_STAGES.map(function(s){
      var c = funnelCounts[s]; var pct = Math.max(4, Math.round(c/maxFunnel*100));

    }).join('') : '<p class="empty-note">Add partners to see the breakdown.</p>';

    var svcCounts = {};
    SERVICE_LINES.forEach(function(s){ svcCounts[s]=0; });
    DATA.partners.forEach(function(p){ (p.service_lines||[]).forEach(function(s){ if(svcCounts.hasOwnProperty(s)) svcCounts[s]++; }); });
    var maxSvc = Math.max.apply(null, SERVICE_LINES.map(function(s){return svcCounts[s];}).concat([1]));
    var svcHtml = DATA.partners.length ? SERVICE_LINES.map(function(s){
      var c = svcCounts[s]; var pct = Math.round(c/maxSvc*100);
      return '<div class="barlist-row"><div class="barlist-name"><span class="swatch" style="background:var(--accent);"></span>'+esc(s)+'</div><div class="barlist-track"><div class="barlist-fill" style="width:'+pct+'%;background:var(--accent);"></div></div><div class="barlist-val tabular">'+c+'</div></div>';
    }).join('') : '<p class="empty-note">Add partners to see interest by service line.</p>';

    var followups = DATA.partners.filter(function(p){ return p.next_follow_up; }).slice().sort(function(a,b){ return a.next_follow_up<b.next_follow_up?-1:1; }).slice(0,8);
    var followupHtml = followups.length ? followups.map(function(p){
      var d = daysUntil(p.next_follow_up);
      var pillClass = d<0?'critical':(d<=7?'warn':'neutral');
      var label = d<0? Math.abs(d)+'d overdue' : d===0? 'Today' : d+'d away';
      return '<div class="followup-row"><div><div class="followup-org">'+esc(p.org_name)+'</div><div class="followup-when">'+fmtDate(p.next_follow_up)+'</div></div><span class="pill '+pillClass+'">'+label+'</span></div>';
    }).join('') : '<p class="empty-note">No follow-ups scheduled yet.</p>';

    var teamCounts = {};
    DATA.team.forEach(function(t){ teamCounts[t.name]=0; });
    var cutoff = Date.now() - 30*86400000;
    DATA.partners.forEach(function(p){
      (p.activity||[]).forEach(function(a){
        if(new Date(a.ts).getTime()>=cutoff){ teamCounts[a.who] = (teamCounts[a.who]||0)+1; }
      });
    });
    var teamEntries = Object.keys(teamCounts).sort(function(a,b){ return teamCounts[b]-teamCounts[a]; });
    var maxTeam = Math.max.apply(null, teamEntries.map(function(n){return teamCounts[n];}).concat([1]));
    var teamHtml = teamEntries.length ? teamEntries.map(function(n){

    var months = [], counts = [];
    for(var i=5;i>=0;i--){
      var dt = new Date(); dt.setDate(1); dt.setMonth(dt.getMonth()-i);
      var key = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
      months.push(dt.toLocaleDateString(undefined,{month:'short'}));
      var c = DATA.partners.filter(function(p){ return p.added_at && p.added_at.slice(0,7)===key; }).length;

        kpiCard('Prospects', k.prospects, 'not yet contacted', ICONS.search)+

        '<div class="card"><h3>Pipeline funnel</h3><div class="funnel">'+funnelHtml+'</div></div>'+
        '<div class="card"><h3>Follow-ups due</h3><div class="followup-list">'+followupHtml+'</div></div>'+
        '<div class="card"><h3>Partners by type</h3><div class="barlist">'+typeHtml+'</div></div>'+

        '<div class="card"><h3>Partners added <span class="n">(6 months)</span></h3>'+sparkSvg+'</div>'+
      '</div>';
  }

  function renderSparkline(counts, labels){
    var w=280, h=90, pad=18;
    var max = Math.max.apply(null, counts.concat([1]));
    var stepX = (w-pad*2)/(counts.length-1||1);
    var pts = counts.map(function(c,i){ var x = pad + i*stepX; var y = h-pad - (c/max)*(h-pad*2-10); return [x,y]; });
    var line = pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
    var area = line + ' L'+pts[pts.length-1][0].toFixed(1)+','+(h-pad)+' L'+pts[0][0].toFixed(1)+','+(h-pad)+' Z';
    var dots = pts.map(function(p,i){ var isLast = i===pts.length-1; return '<circle class="spark-dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(isLast?3.5:2)+'"/>'; }).join('');
    var labelsHtml = labels.map(function(l,i){ return '<text class="spark-label" x="'+pts[i][0].toFixed(1)+'" y="'+(h-2)+'" text-anchor="middle">'+esc(l)+'</text>'; }).join('');
    return '<div class="spark-wrap"><svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'"><line class="spark-grid" x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'"/><path class="spark-area" d="'+area+'"/><path class="spark-line" d="'+line+'"/>'+dots+labelsHtml+'</svg></div>';
  }

          (t.role==='owner' ? '' : '<button class="btn btn-sm" data-promote="'+t.id+'">Make owner</button>')+
          '<button class="btn btn-sm btn-ghost" data-remove-team="'+t.id+'">Remove</button>'+
        '</div>';
      }
      return '<div class="team-row"><div class="team-row-left"><div class="avatar">'+esc(initials(t.name))+'</div><div><strong>'+esc(t.name)+'</strong>'+(self?' <span class="muted">(you)</span>':'')+'<div class="muted" style="font-size:12px;">'+count+' partner'+(count===1?'':'s')+' added</div></div></div><div style="display:flex;align-items:center;gap:10px;"><span class="role-badge'+(t.role==='member'?' member':'')+'">'+esc(t.role)+'</span>'+actions+'</div></div>';
    }).join('') : '<p class="empty-note">Loading…</p>';

    return ''+
      '<div class="grid panels">'+
        '<div class="card"><h3>'+ICONS.team+' Team</h3>'+teamRows+
          '<div class="info-box" style="margin-top:14px;">Share this app\'s link with a teammate — when they create an account, they show up here automatically. The owner can promote another teammate to owner, or remove someone\'s access.</div>'+
        '</div>'+
        '<div class="card"><h3>Your account</h3>'+
          '<div class="field"><label>Signed in as</label><div style="padding:9px 0;font-weight:600;">'+esc((session&&session.user&&session.user.email)||'')+'</div></div>'+
          '<div class="info-box">Real accounts, real passwords — Supabase Auth handles sign-in, so there\'s nothing shared or guessable here. Only the owner ('+esc(ownerName())+') can delete referral partners or remove teammates.</div>'+
        '</div>'+
      '</div>'+
      '<div class="card section-gap"><h3>Export</h3><p class="muted" style="font-size:12.5px;margin-top:0;">Download every referral partner as a CSV — useful for a working session with Claude on your marketing strategy, or to hand to a teammate.</p><button class="btn" id="export-csv-btn">Export partners as CSV</button></div>';
  }

  function renderMarketingView(){
    var mp = DATA.marketingPlan || DEFAULT_MARKETING_PLAN;
    var campRows = DATA.campaigns.length ? DATA.campaigns.map(function(c){
      return '<tr><td class="org-cell">'+esc(c.name)+'</td><td>'+esc(c.channel)+'</td><td>'+esc(c.segment)+'</td><td><span class="pill '+(c.status==='Active'?'good':c.status==='Complete'?'neutral':'warn')+'">'+esc(c.status)+'</span></td><td>'+fmtDate(c.date)+'</td><td><button class="btn btn-sm btn-ghost" data-del-campaign="'+c.id+'">Remove</button></td></tr>';
    }).join('') : '<tr><td colspan="6" class="empty-note">No campaigns yet.</td></tr>';

    return ''+
      '<div class="banner info">Export your partner data (Team → Export CSV) any time and ask Claude to turn the current pipeline into a refreshed strategy — this workspace is a living starting point.</div>'+
      '<div class="grid panels">'+
        '<div class="card strategy-block"><h4>Target segments</h4><textarea id="ms-target_segments">'+esc(mp.target_segments)+'</textarea></div>'+
        '<div class="card strategy-block"><h4>Channels &amp; tactics</h4><textarea id="ms-channels_tactics">'+esc(mp.channels_tactics)+'</textarea></div>'+
        '<div class="card strategy-block"><h4>Messaging pillars</h4><textarea id="ms-messaging_pillars">'+esc(mp.messaging_pillars)+'</textarea></div>'+
        '<div class="card strategy-block"><h4>90-day action plan</h4><textarea id="ms-ninety_day_plan">'+esc(mp.ninety_day_plan)+'</textarea></div>'+
      '</div>'+
      '<div style="margin:10px 0 0;"><button class="btn btn-primary btn-sm" id="save-strategy-btn">Save strategy notes</button></div>'+
      '<div class="card section-gap"><h3>Campaign tracker</h3>'+
        '<div class="table-scroll"><table><thead><tr><th>Campaign</th><th>Channel</th><th>Target segment</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody>'+campRows+'</tbody></table></div>'+
        '<div class="field-row" style="margin-top:14px;align-items:end;">'+
          '<div class="field" style="margin-bottom:0;"><label>Campaign</label><input id="camp-name" placeholder="e.g. Discharge planner lunch series"/></div>'+
          '<div class="field" style="margin-bottom:0;"><label>Channel</label><input id="camp-channel" placeholder="e.g. In-person"/></div>'+
        '</div>'+
        '<div class="field-row" style="margin-top:10px;align-items:end;">'+
          '<div class="field" style="margin-bottom:0;"><label>Target segment</label><input id="camp-segment" placeholder="e.g. Hospitals"/></div>'+
          '<div class="field" style="margin-bottom:0;"><label>Date</label><input type="date" id="camp-date"/></div>'+
        '</div>'+
        '<div style="margin-top:10px;"><button class="btn btn-primary btn-sm" id="add-campaign-btn">Add campaign</button></div>'+
      '</div>';
  }

  function toCsv(){
    var cols = ['Organization','Type','Service Lines','Address','City','Contacts','Stage','Priority','Next Follow-up','Added By','Added At','Last Updated By','Last Updated At'];
    var rows = DATA.partners.map(function(p){
      var contactsStr = (p.contacts||[]).map(function(c){
        return [c.name,c.title,c.phone,c.email].filter(Boolean).join(' / ');
      }).join(' | ');
      return [p.org_name, typeInfo(p.type).label, (p.service_lines||[]).join('; '), p.address, p.city, contactsStr, p.stage, p.priority, p.next_follow_up, p.added_by_name, p.added_at, p.updated_by_name, p.updated_at];
    });
    function esc1(v){ v = v===undefined||v===null?'':String(v); if(/[",\n]/.test(v)){ v = '"'+v.replace(/"/g,'""')+'"'; } return v; }
    var lines = [cols.map(esc1).join(',')].concat(rows.map(function(r){ return r.map(esc1).join(','); }));
    return lines.join('\n');
  }
  function downloadCsv(){
    var blob = new Blob([toCsv()], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'placita-partners.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function render(){
    var navItems = [
      {key:'dashboard', label:'Dashboard', ico:ICONS.dashboard},
      {key:'partners', label:'Referral Partners', ico:ICONS.partners},
      {key:'marketing', label:'Marketing Plan', ico:ICONS.marketing},
      {key:'team', label:'Team & Settings', ico:ICONS.team}
    ];
    var navHtml = navItems.map(function(n){
      return '<button class="nav-btn'+(currentView===n.key?' active':'')+'" data-nav="'+n.key+'">'+n.ico+n.label+'</button>';
    }).join('');

    document.getElementById('sidebar').innerHTML =
      '<div class="brand"><div class="mark">P</div><div class="names"><div class="org">Placita Group</div><div class="sub">Partner CRM</div></div></div>'+
      '<div class="nav">'+navHtml+'</div>'+
      '<div class="sync-dot">'+ICONS.sync+'<span>Synced live</span></div>';

    var titleMap = {dashboard:'Dashboard', partners:'Referral Partners', marketing:'Marketing Plan', team:'Team & Settings'};
    var subMap = {
      dashboard:'Placita Group referral network at a glance',
      partners: DATA.partners.length+' referral partner'+(DATA.partners.length===1?'':'s')+' tracked',
      marketing:'Strategy notes and campaign tracker',
      team:'Roster, permissions, and export'
    };

    document.getElementById('main').innerHTML =
      '<div class="topbar"><div><h1>'+titleMap[currentView]+'</h1><div class="meta">'+subMap[currentView]+'</div></div>'+
        '<div class="user-menu"><button class="user-btn" id="user-btn"><div class="avatar">'+esc(initials(profile.name))+'</div><div><div class="name">'+esc(profile.name)+'</div><div class="role">'+esc(profile.role)+'</div></div>'+ICONS.chevronDown+'</button>'+
          '<div class="user-dropdown'+(userMenuOpen?' open':'')+'" id="user-dropdown"><button id="signout-btn">'+ICONS.logout+' Sign out</button></div>'+
        '</div>'+
      '</div>'+
      '<div class="view active">'+
        (currentView==='dashboard'?renderDashboard():currentView==='partners'?renderPartnersView():currentView==='marketing'?renderMarketingView():renderTeamView())+
      '</div>';

    wireEvents();
    if(slideOverOpen){
      renderSlideOver();
      document.getElementById('scrim').classList.add('open');
      document.getElementById('slideover').classList.add('open');
    }
  }

  function wireEvents(){
    document.querySelectorAll('[data-nav]').forEach(function(b){ b.addEventListener('click', function(){ switchView(b.getAttribute('data-nav')); }); });
    document.getElementById('scrim').addEventListener('click', closeSlideOver);

    var userBtn = document.getElementById('user-btn');
    if(userBtn){
      userBtn.addEventListener('click', function(e){ e.stopPropagation(); userMenuOpen = !userMenuOpen; document.getElementById('user-dropdown').classList.toggle('open', userMenuOpen); });
      document.addEventListener('click', function closeUserMenu(){ if(userMenuOpen){ userMenuOpen=false; var dd=document.getElementById('user-dropdown'); if(dd) dd.classList.remove('open'); } }, {once:true});
    }
    var signoutBtn = document.getElementById('signout-btn');
    if(signoutBtn) signoutBtn.addEventListener('click', async function(){ await sbClient.auth.signOut(); });

    if(currentView==='partners'){
      var addBtn = document.getElementById('add-partner-btn');
      if(addBtn) addBtn.addEventListener('click', function(){ openPartnerForm(null); });
      var importBtn = document.getElementById('import-csv-btn');
      if(importBtn) importBtn.addEventListener('click', openImportModal);
      document.querySelectorAll('[data-open]').forEach(function(tr){ tr.addEventListener('click', function(){ openPartnerForm(tr.getAttribute('data-open')); }); });
      document.querySelectorAll('[data-stage-filter]').forEach(function(chip){
        chip.addEventListener('click', function(){ var s = chip.getAttribute('data-stage-filter'); filters.stage = filters.stage===s? null : s; render(); });
      });
      var search = document.getElementById('search-input');
      if(search){
        search.addEventListener('input', function(){
          filters.q = search.value; render();
          var el=document.getElementById('search-input');
          if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); }
        });
      }
      document.querySelectorAll('[data-sort]').forEach(function(th){
        th.addEventListener('click', function(){ var col = th.getAttribute('data-sort'); if(sortCol===col) sortDir*=-1; else { sortCol=col; sortDir=1; } render(); });
      });
    }

    if(currentView==='team'){
      document.querySelectorAll('[data-remove-team]').forEach(function(b){
        b.addEventListener('click', function(){
          var id = b.getAttribute('data-remove-team');
          requireOwnerConfirm('Remove this teammate?', function(){ return removeMemberConfirmed(id); });
        });
      });
      document.querySelectorAll('[data-promote]').forEach(function(b){
        b.addEventListener('click', async function(){ await setRole(b.getAttribute('data-promote'), 'owner'); toast('Ownership updated'); render(); });
      });
      var exportBtn = document.getElementById('export-csv-btn');
      if(exportBtn) exportBtn.addEventListener('click', function(){ downloadCsv(); toast('Downloaded'); });
    }

    if(currentView==='marketing'){
      var saveStrategyBtn = document.getElementById('save-strategy-btn');
      if(saveStrategyBtn) saveStrategyBtn.addEventListener('click', async function(){
        var patch = {
          id:1,
          target_segments: document.getElementById('ms-target_segments').value,
          channels_tactics: document.getElementById('ms-channels_tactics').value,
          messaging_pillars: document.getElementById('ms-messaging_pillars').value,
          ninety_day_plan: document.getElementById('ms-ninety_day_plan').value,
          updated_at: nowIso()
        };
        var res = await sbClient.from('marketing_plan').upsert(patch).select().single();
        if(res.error){ toast('Couldn’t save: '+res.error.message, true); return; }
        DATA.marketingPlan = res.data;
        toast('Strategy saved');
      });
      var addCampBtn = document.getElementById('add-campaign-btn');
      if(addCampBtn) addCampBtn.addEventListener('click', async function(){
        var name = document.getElementById('camp-name').value.trim();
        if(!name){ toast('Campaign name is required', true); return; }
        var row = { name:name, channel:document.getElementById('camp-channel').value.trim(), segment:document.getElementById('camp-segment').value.trim(), status:'Planned', date:document.getElementById('camp-date').value||null, added_by:session.user.id };
        var res = await sbClient.from('campaigns').insert(row).select().single();
        if(res.error){ toast('Couldn’t save: '+res.error.message, true); return; }
        DATA.campaigns.unshift(res.data); toast('Campaign added'); render();
      });
      document.querySelectorAll('[data-del-campaign]').forEach(function(b){
        b.addEventListener('click', function(){
          var id = b.getAttribute('data-del-campaign');
          requireOwnerConfirm('Remove this campaign?', async function(){
            var res = await sbClient.from('campaigns').delete().eq('id', id);
            if(res.error){ toast('Couldn’t remove: '+res.error.message, true); return; }
            DATA.campaigns = DATA.campaigns.filter(function(c){ return c.id!==id; });
          });
        });
      });
    }
  }

  async function boot(sess){
    session = sess;
    try{
      await loadAll();
    }catch(e){
      var bootErrEl = document.getElementById('boot'); if(bootErrEl) bootErrEl.remove();
      document.getElementById('auth-root').innerHTML = '<div class="config-warning">Couldn\'t load your data: '+esc(e.message||String(e))+'. Make sure schema.sql has been run in your Supabase project, then reload.</div>';
      return;
    }
    subscribeRealtime();
    var bootOkEl = document.getElementById('boot'); if(bootOkEl) bootOkEl.remove();
    document.getElementById('auth-root').innerHTML = '';
    document.getElementById('app-shell').classList.add('on');
    render();
  }

  sbClient.auth.onAuthStateChange(function(event, sess){
    if(sess){
      boot(sess);
    }else{
      session = null; profile = null;
      document.getElementById('app-shell').classList.remove('on');
      var b = document.getElementById('boot'); if(b) b.remove();
      authMode = 'signin';
      renderAuth();
    }
  });

})();
</script>
</body>
</html>
